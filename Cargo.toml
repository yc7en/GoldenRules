[workspace]
resolver = "2"
members = [
  "crates/gr-contract",
  "crates/gr-ir",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
gr-contract = { path = "crates/gr-contract" }
gr-ir = { path = "crates/gr-ir" }
gr-vm = { path = "crates/gr-vm" }
gr-engine = { path = "crates/gr-engine" }
gr-provider = { path = "crates/gr-provider" }

[profile.release]
opt-level = 3
lto = "thin"
